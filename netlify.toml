[build]
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Friendly path for the frontend fetch().
[[redirects]]
  from = "/api/case-plan"
  to = "/.netlify/functions/case-plan"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
